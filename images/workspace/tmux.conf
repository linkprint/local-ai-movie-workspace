# Let tmux own mouse-wheel events so xterm never converts them into Up/Down
# input for Codex. Keyboard arrow keys continue to reach the active program.
set-option -g mouse on
set-option -g history-limit 10000

# Wheel-up always enters tmux copy mode, even when the program inside the pane
# has enabled mouse reporting. In copy mode, the wheel scrolls terminal history.
unbind-key -T root WheelUpPane
bind-key -T root WheelUpPane copy-mode -e
bind-key -T copy-mode WheelUpPane send-keys -X -N 5 scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X -N 5 scroll-down
bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 5 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 5 scroll-down
