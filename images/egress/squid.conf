http_port 3128
visible_hostname movie-egress

acl SSL_ports port 443
acl CONNECT method CONNECT
acl bootstrap_openai dstdomain "/etc/squid/openai-bootstrap-domains.txt"

http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT bootstrap_openai
http_access deny all

cache deny all
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
request_header_access Cache-Control deny all

logformat movie %ts.%03tu %>a %Ss/%03>Hs %<st %rm %ru
access_log stdio:/dev/stdout movie
cache_log /dev/stderr
cache_store_log none
pid_filename /run/squid.pid
coredump_dir /tmp

shutdown_lifetime 2 seconds
connect_timeout 10 seconds
request_timeout 2 minutes
